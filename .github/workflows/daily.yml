name: Daily fund run

on:
  schedule:
    - cron: "30 22 * * 1-5"     # 5:30 pm New York (EST) / 6:30 pm (EDT), every weekday after the close
  workflow_dispatch:             # "Run workflow" button for a manual run
  push:
    branches: [main]
    paths: ["site/**", "fund/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fund
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Process today's close
        run: python -m fund.run_daily
      - name: Build website
        run: python site/build.py
      - name: Save the books
        run: |
          git config user.name "hanna-capital-bot"
          git config user.email "hanna-capital-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Close of $(date -u +%Y-%m-%d): update NAV, positions, trades"
          git pull --rebase
          git push
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
