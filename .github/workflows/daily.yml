name: Daily fund run

on:
  schedule:
    - cron: "30 22 * * 1-5"     # 5:30 pm New York (EST) / 6:30 pm (EDT), every weekday after the close
  workflow_dispatch:             # "Run workflow" button for a manual run
  push:
    branches: [main]
    paths: ["site/**", "fund/**", "v3/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fund
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      v2: ${{ steps.v2.outcome }}
      v3: ${{ steps.v3.outcome }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Process today's close (v2)
        id: v2
        continue-on-error: true       # one fund's problem must never block the other's books or the site
        run: python -m fund.run_daily
      - name: Process today's close (v3)
        id: v3
        continue-on-error: true
        run: python -m v3.run_daily
      - name: Save the books
        run: |
          git config user.name "hanna-capital-bot"
          git config user.email "hanna-capital-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Close of $(date -u +%Y-%m-%d): update NAV, positions, trades"
          git pull --rebase
          git push
      - name: Build website
        run: python site/build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4

  alert:                          # fails the run (GitHub emails the owner) if a fund errored or is stuck
    needs: [run, deploy]
    if: ${{ always() && (needs.run.outputs.v2 == 'failure' || needs.run.outputs.v3 == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::A fund did not finish: v2 ${{ needs.run.outputs.v2 }}, v3 ${{ needs.run.outputs.v3 }}. Open the 'run' job log for the reason."
          exit 1
