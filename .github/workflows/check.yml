name: Pre-launch formula check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run the live engine over history once
        run: python -m fund.check
      - name: Save the result
        run: |
          git config user.name "hanna-capital-bot"
          git config user.email "hanna-capital-bot@users.noreply.github.com"
          git add data/check.json
          git diff --cached --quiet || git commit -m "Pre-launch formula check"
          git pull --rebase
          git push
